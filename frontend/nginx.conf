server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /statistik/;
    }

    location = /statistik {
        return 301 /statistik/;
    }

    # Prefix publik /statistik/api dihapus sebelum diteruskan ke FastAPI,
    # yang tetap mendefinisikan endpoint pada /api/*.
    location /statistik/api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset Vite dan fallback React Router berada di bawah /statistik/.
    location /statistik/ {
        try_files $uri $uri/ /statistik/index.html;
    }
}
